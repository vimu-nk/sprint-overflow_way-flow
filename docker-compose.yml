# WayFlow full stack. `docker compose up --build` on a fresh clone starts everything:
# postgres → migrate (migrations + least-privilege role + CSV seed, then exits) → api → gateway.
# Values default to local-demo placeholders so it runs without a .env; override them in .env.
# For any shared deployment set NODE_ENV=production, real secrets and HTTPS (see docs/deployment.md).

x-hardened: &hardened
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  restart: unless-stopped

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  TZ: Asia/Colombo
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-wayflow}:${POSTGRES_PASSWORD:-wayflow}@postgres:5432/${POSTGRES_DB:-wayflow}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-wayflow-app-db-dev}
  APP_DATABASE_URL: postgres://wayflow_app:${APP_DB_PASSWORD:-wayflow-app-db-dev}@postgres:5432/${POSTGRES_DB:-wayflow}
  VALKEY_URL: redis://valkey:6379
  S3_ENDPOINT: http://rustfs:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wayflow-app}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-wayflow-app-secret}
  S3_BUCKET: ${S3_BUCKET:-pod}
  PLANNER_URL: http://planner:8000
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
  REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-dev-only-refresh-pepper-change-me-0123456789ab}
  CSRF_SECRET: ${CSRF_SECRET:-dev-only-csrf-secret-change-me-0123456789abcdef}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  TRUST_PROXY_HOPS: '1'
  ENABLE_API_DOCS: 'false'
  ENABLE_DEMO_TOOLS: ${ENABLE_DEMO_TOOLS:-true}
  SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Waypoint-Demo-2026!}
  APP_SIMULATION_DATE: ${APP_SIMULATION_DATE:-2026-05-19}
  APP_SIMULATION_TIME: ${APP_SIMULATION_TIME:-14:00}
  DATA_DIR: /data/source

services:
  gateway:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.29-alpine
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

  web:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    read_only: true
    tmpfs: [/tmp]

  api:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./data:/data:ro # competition CSVs, read for the demo reset
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      planner:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 768m }

  # One-shot: migrations, least-privilege DB role, CSV reference data and demo seed. Idempotent.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/seed/run.js']
    environment: *api-env
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  planner:
    <<: *hardened
    build: ./services/planner
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { memory: 1g }

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wayflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wayflow}
      POSTGRES_DB: ${POSTGRES_DB:-wayflow}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432' # dev only, bound to localhost (SEC-61)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.0-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - valkeydata:/data
    ports:
      - '127.0.0.1:${VALKEY_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      # Root credentials: console login at http://localhost:9001 (dev only)
      RUSTFS_ACCESS_KEY: ${RUSTFS_ADMIN_USER:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_ADMIN_PASSWORD:-rustfsadmin-change-me}
    volumes:
      - rustfsdata:/data
    ports:
      - '127.0.0.1:9000:9000' # S3 API (dev)
      - '127.0.0.1:9001:9001' # Console (dev)
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: bucket + least-privilege app user for the API (infra/rustfs/init.sh)
  storage-init:
    image: rustfs/rc:v0.1.36
    entrypoint: ['sh', '/init/init.sh']
    environment:
      RUSTFS_ADMIN_USER: ${RUSTFS_ADMIN_USER:-rustfsadmin}
      RUSTFS_ADMIN_PASSWORD: ${RUSTFS_ADMIN_PASSWORD:-rustfsadmin-change-me}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wayflow-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-wayflow-app-secret}
      S3_BUCKET: ${S3_BUCKET:-pod}
      S3_ENDPOINT: http://rustfs:9000
    volumes:
      - ./infra/rustfs:/init:ro
    depends_on:
      rustfs:
        condition: service_healthy
    restart: 'no'

volumes:
  pgdata:
  valkeydata:
  rustfsdata:
