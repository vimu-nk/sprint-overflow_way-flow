services:
  gateway:
    image: nginx:1.30-alpine
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wayflow}:${POSTGRES_PASSWORD:-wayflow}@postgres:5432/${POSTGRES_DB:-wayflow}
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wayflow-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-wayflow-app-secret}
      S3_BUCKET: ${S3_BUCKET:-pod}
      PLANNER_URL: http://planner:8000
      JWT_SECRET: ${JWT_SECRET:-change-me}
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      planner:
        condition: service_started
    restart: unless-stopped

  planner:
    build: ./services/planner
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wayflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wayflow}
      POSTGRES_DB: ${POSTGRES_DB:-wayflow}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.0-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - valkeydata:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      # Root credentials: console login at http://localhost:9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ADMIN_USER:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_ADMIN_PASSWORD:-rustfsadmin-change-me}
    volumes:
      - rustfsdata:/data
    ports:
      - '9000:9000' # S3 API (dev)
      - '9001:9001' # Console (dev)
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: bucket + least-privilege app user for the API (infra/rustfs/init.sh)
  storage-init:
    image: rustfs/rc:v0.1.36
    entrypoint: ['sh', '/init/init.sh']
    environment:
      RUSTFS_ADMIN_USER: ${RUSTFS_ADMIN_USER:-rustfsadmin}
      RUSTFS_ADMIN_PASSWORD: ${RUSTFS_ADMIN_PASSWORD:-rustfsadmin-change-me}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wayflow-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-wayflow-app-secret}
      S3_BUCKET: ${S3_BUCKET:-pod}
      S3_ENDPOINT: http://rustfs:9000
    volumes:
      - ./infra/rustfs:/init:ro
    depends_on:
      rustfs:
        condition: service_healthy
    restart: 'no'

volumes:
  pgdata:
  valkeydata:
  rustfsdata:
