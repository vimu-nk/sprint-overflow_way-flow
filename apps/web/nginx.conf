# Static SPA only. Routing, gzip and headers live in the gateway (infra/nginx/gateway.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Service worker and shell must revalidate so PWA updates land
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
