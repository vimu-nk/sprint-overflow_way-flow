# Public entrypoint, the only container with a published port. Browser -> gateway -> web | api.
# The planner is internal and deliberately has no route here.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    client_max_body_size 6m;          # uploads ≤ 5 MB + form overhead (SEC-39)
    client_body_timeout 30s;          # slow-loris resistance (SEC-55)
    client_header_timeout 15s;
    keepalive_timeout 30s;

    # Security headers for every response (SEC-46, SEC-47, SEC-52).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header X-Powered-By;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_read_timeout 60s;
    }

    # Server-sent events: no buffering, long reads.
    location = /api/v1/notifications/stream {
        proxy_pass http://api:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:8080;
    }
}
