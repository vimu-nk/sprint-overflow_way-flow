# Host nginx site for wayflow.vimunk.tech (TLS via certbot). Install once:
#   sudo ln -sf ~/way-flow/infra/nginx/wayflow-host.conf /etc/nginx/sites-enabled/wayflow
# Obtain the certificate first (docs/deployment-ec2.md section 10.2).
server {
    listen 80;
    listen [::]:80;
    server_name wayflow.vimunk.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wayflow.vimunk.tech;

    ssl_certificate     /etc/letsencrypt/live/wayflow.vimunk.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wayflow.vimunk.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 6m;        # photo uploads up to 5 MB (matches the gateway)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Only HSTS here. CSP and the other security headers come from the gateway and API.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-sent events (live notifications): no buffering, long reads.
    location = /api/v1/notifications/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 60s;
    }
}
