[project]
name = "wayflow-planner"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "ortools",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = ["ruff", "pytest", "httpx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
